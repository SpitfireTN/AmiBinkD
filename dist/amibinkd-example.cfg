# AmiBinkD example configuration file
# Copy this to <netname>.cfg (or AmiBinkD.cfg for the inbound server) and
# edit for your own system. See manual.txt section 06 for the full
# keyword reference and section 07 for the multi-network layout this
# example assumes.

# Your FTN domain(s). Repeat one "domain" line per network you carry.
# <zone> at the end must match the zone number in your address below.
domain example DH3:Echomail/Outbound/ 1

# Optional: aliases let a hub/link refer to the same domain under a
# different name (uppercase/lowercase and punctuation variants, etc).
#domain example-alias alias-for example

# Your own FTN address(es), one per domain:
address 1:2/3@example

# The name of your system, its location, and your name
sysname "Your BBS Name"
location "Your City, ST"
sysop "Your Name"

# System capabilities string sent to remote nodes
nodeinfo 115200,TCP,BINKP

# TCP port for inbound connections. Leave unchanged unless you know why
# you need to change it.
iport 24554

# How long to wait for a TCP connection to a node to be answered, in
# seconds, before giving up and trying the next one. Without this a node
# whose host is down can hold a poll open until the OS gives up on its
# own, which on AmigaOS can be minutes per dead link.
connect-timeout 60

# Delay calls and outbound rescans, in seconds
rescan-delay 1

# How many outbound sessions may run at once. Only matters if you poll
# several nodes in one invocation (-P ALL, or several -P switches);
# the default is 100, i.e. all of them at the same time.
#
# 1 is recommended on this port, and is what the author runs. Polling
# every node at once is where a slow or wedged link stops being one
# network's problem and becomes every network's problem. Sequential is
# a little slower and much easier to reason about when something hangs.
#
# call-delay is how long to wait before looking for more work once that
# many sessions are already running -- its default of 60 makes a capped
# run idle a full minute between batches, so keep it small whenever you
# cap maxclients.
maxclients 1
call-delay 5

# Don't send (only receive) files if no password is set for an inbound
# session -- a reasonable safety default.
send-if-pwd

# Path and name for the logfile, and how verbose it should be (1-9)
log SysData:log/AmiBinkD.log
loglevel 4

# Uncomment to also echo the log to the console/Shell this was run from
#conlog 4

# The log is already trimmed at the default loglevel 4 -- one line per
# connection, one per file, one per result. If you raise loglevel to see
# protocol detail, the `nolog' keyword can hide individual messages again.
# See manual.txt section 06 for how it works and the two traps it carries.

# Print live transfer percentages while sending or receiving
percents

# List the outbound queue (what is waiting for each node) at the start of
# a poll. Useful for confirming that mail really is queued when a link
# looks quiet.
printq

# Perform reverse DNS resolving, for nicer hostnames in the log only.
# See manual.txt section 12 before enabling this on a system that might
# receive inbound connections from private/non-routable addresses.
#backresolv

# Inbound directories for secure (password-verified) and non-secure
# sessions. Can point at the same directory.
inbound DH3:Echomail/Inbound/
inbound-nonsecure DH3:Echomail/Inbound/
temp-inbound DH3:Echomail/Inbound_Temp/

# Refuse new files if free space (in KB) on the inbound volume drops
# below this
minfree 2048
minfree-nonsecure 2048

# Remove a duplicate partial file when starting a fresh receive
kill-dup-partial-files

# Remove stale partial files older than this
# 2h: long enough for an interrupted transfer to be resumed on the next
# poll, short enough that orphaned .dt/.hr pairs do not sit in the temp
# inbound making every later session log "Text file busy" as it scans past
# them. The original Amiga port used 30 seconds, which is aggressive
# enough to destroy a partial that is still resumable.
kill-old-partial-files 2h

# Remove stale .bsy/.csy busy-flag files older than this (e.g. left
# behind by a crash)
kill-old-bsy 2h

# Use Amiga-style outbound directory naming (recommended on this port)
aso

# Stamp received files with the sender's date, and keep our own .bsy
# datestamps fresh. OFF by default on this port and best left that way:
# SetFileDate() never returns when another Process holds the file, which
# hangs the session for good. Only enable it if nothing else on the
# machine touches the inbound/outbound directories while the mailer runs.
# See manual.txt section 06.
#set-file-dates yes

# One line per node you poll or accept mail from:
#   node <address> <host>:<port> <password>
# "AmiBinkD -p -PALL <this file>" polls every node listed here.
node 1:2/1@example your.hub.example.com:24554 YourAreafixPassword

